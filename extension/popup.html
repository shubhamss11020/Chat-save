<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat-Save</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --border: #dde3ea;
      --text: #1f2a37;
      --text-muted: #5f6b7a;
      --accent: #2f5d8a;
      --accent-hover: #264d74;
      --ok: #2e7d5b;
      --ok-bg: #e8f3ee;
      --warn: #9a6700;
      --warn-bg: #fdf4e3;
      --danger: #a33a3a;
      --danger-bg: #fbeeee;
      --code-bg: #eef2f6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101418;
        --surface: #171c22;
        --border: #2a323c;
        --text: #e6e9ee;
        --text-muted: #9aa5b1;
        --accent: #6c93bf;
        --accent-hover: #86a9d1;
        --ok: #5fb392;
        --ok-bg: #163025;
        --warn: #d9a441;
        --warn-bg: #33270f;
        --danger: #e08585;
        --danger-bg: #3a1f1f;
        --code-bg: #11161b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #101418;
      --surface: #171c22;
      --border: #2a323c;
      --text: #e6e9ee;
      --text-muted: #9aa5b1;
      --accent: #6c93bf;
      --accent-hover: #86a9d1;
      --ok: #5fb392;
      --ok-bg: #163025;
      --warn: #d9a441;
      --warn-bg: #33270f;
      --danger: #e08585;
      --danger-bg: #3a1f1f;
      --code-bg: #11161b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ok);
    }
    .status.warn { color: var(--warn); }
    .status.danger { color: var(--danger); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 12px;
    }
    .label {
      color: var(--text-muted);
      white-space: nowrap;
    }
    .val {
      font-weight: 600;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .val.warn { color: var(--warn); }
    .val.danger { color: var(--danger); }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--code-bg); }
    .btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .link {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
    .link:hover { text-decoration: underline; }
    .managed-badge {
      font-size: 10px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Chat-Save</h1>
      <span class="managed-badge" id="managedBadge">Managed by your organization</span>
    </div>
    <div class="status" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Connected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-row">
      <span class="label">Saving as</span>
      <span class="val" id="valUser">Not connected</span>
    </div>
    <div class="card-row">
      <span class="label">Server</span>
      <span class="val" id="valServer">Not set</span>
    </div>
    <div class="card-row">
      <span class="label">Waiting to save</span>
      <span class="val" id="valQueue">None</span>
    </div>
    <div class="card-row" id="rowDeadLetter" style="display: none;">
      <span class="label">Could not save</span>
      <span class="val danger" id="valDeadLetter">0</span>
    </div>
    <div class="card-row">
      <span class="label">Last save</span>
      <span class="val" id="valReceipt">None yet</span>
    </div>
    <div class="card-row">
      <span class="label">Last sync</span>
      <span class="val" id="valLastSync">Never</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnSyncNow">Save now</button>
    <button class="btn btn-secondary" id="btnRetryDLQ" style="display: none;">Try again for failed saves</button>
  </div>

  <div class="footer">
    <span id="versionText">v1.0.0</span>
    <a class="link" id="linkOptions">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
