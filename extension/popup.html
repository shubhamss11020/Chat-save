<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat-Save Claude Connector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .label {
      color: var(--text-muted);
    }
    .val {
      font-weight: 500;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    code.val {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #38bdf8;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .link {
      color: #60a5fa;
      text-decoration: none;
      cursor: pointer;
    }
    .link:hover {
      text-decoration: underline;
    }
    .managed-badge {
      font-size: 10px;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <h1>Chat-Save</h1>
      <span class="managed-badge" id="managedBadge">Enterprise Managed</span>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Active</span>
    </div>
  </div>

  <div class="card">
    <div class="card-row">
      <span class="label">User:</span>
      <span class="val" id="valUser">shubham</span>
    </div>
    <div class="card-row">
      <span class="label">Server:</span>
      <span class="val" id="valServer">http://localhost:8000</span>
    </div>
    <div class="card-row">
      <span class="label">Offline Queue:</span>
      <span class="val" id="valQueue">0 pending</span>
    </div>
    <div class="card-row" id="rowDeadLetter" style="display: none;">
      <span class="label" style="color: #f87171;">Dead Letter:</span>
      <span class="val" id="valDeadLetter" style="color: #f87171; font-weight: 600;">0 failed</span>
    </div>
    <div class="card-row">
      <span class="label">Last Receipt:</span>
      <code class="val" id="valReceipt">None yet</code>
    </div>
    <div class="card-row">
      <span class="label">Last Synced:</span>
      <span class="val" id="valLastSync">Never</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button class="btn btn-primary" id="btnSyncNow">
      <span>⟳</span>
      <span>Sync Outbox Now</span>
    </button>
    <button class="btn" id="btnRetryDLQ" style="display: none; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);">
      <span>⚠</span>
      <span>Retry Dead Letter Items</span>
    </button>
  </div>

  <div class="footer">
    <span id="versionText">v1.0.0</span>
    <a class="link" id="linkOptions">Settings &amp; Logs ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
