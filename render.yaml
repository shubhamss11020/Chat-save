services:
  - type: web
    name: chat-memory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CHATSAVE_WATCH        # no local Claude files on Render
        value: "0"
      - key: CHATSAVE_REPO_DIR
        value: /tmp/chat-data
      - key: CHATSAVE_STORAGE
        value: /tmp/chat-storage
      - key: CHATSAVE_PULL_SECONDS
        value: "60"
      - key: CHATSAVE_GIT_NAME
        value: chat-memory
      - key: CHATSAVE_GIT_EMAIL
        value: chat-memory@users.noreply.github.com
      - key: CHATSAVE_GIT_URL      # https://<github-token>@github.com/<you>/<repo>.git
        sync: false
      - key: MCP_AUTH_TOKEN        # long random string
        sync: false
